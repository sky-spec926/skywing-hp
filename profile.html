<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>シミズツバサ — AI エンジニア</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;700&family=Space+Grotesk:wght@300;400;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --accent: #7c3aed;
      --accent2: #06b6d4;
      --text: #e2e8f0;
      --muted: #64748b;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Grotesk', 'Noto Sans JP', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    /* Animated background grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(124,58,237,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(124,58,237,0.04) 1px, transparent 1px);
      background-size: 48px 48px;
      z-index: 0;
    }

    /* Glow orbs */
    body::after {
      content: '';
      position: fixed;
      width: 600px; height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(124,58,237,0.12) 0%, transparent 70%);
      top: -200px; left: -200px;
      z-index: 0;
    }

    .orb2 {
      position: fixed;
      width: 500px; height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(6,182,212,0.10) 0%, transparent 70%);
      bottom: -150px; right: -150px;
      z-index: 0;
      pointer-events: none;
    }

    main {
      position: relative;
      z-index: 1;
      width: min(660px, 92vw);
      padding: 2rem 0;
    }

    /* Card */
    .card {
      background: var(--surface);
      border: 1px solid rgba(124,58,237,0.2);
      border-radius: 24px;
      padding: 3rem 3rem 2.5rem;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.03),
        0 32px 64px rgba(0,0,0,0.5);
      backdrop-filter: blur(12px);
    }

    /* Top badge */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(124,58,237,0.15);
      border: 1px solid rgba(124,58,237,0.35);
      border-radius: 100px;
      padding: 4px 14px;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #a78bfa;
      margin-bottom: 2rem;
    }
    .badge::before {
      content: '';
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #a78bfa;
      box-shadow: 0 0 8px #a78bfa;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* Avatar */
    .avatar {
      width: 88px; height: 88px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 0 32px rgba(124,58,237,0.35);
      position: relative;
    }
    .avatar::after {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      border: 2px solid transparent;
      background: linear-gradient(135deg, var(--accent), var(--accent2)) border-box;
      -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: destination-out;
      mask-composite: exclude;
    }

    /* Name */
    h1 {
      font-size: clamp(2rem, 6vw, 2.8rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.1;
      background: linear-gradient(135deg, #fff 30%, #a78bfa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
    }

    .role {
      font-size: 1rem;
      color: var(--accent2);
      letter-spacing: 0.04em;
      margin-bottom: 2rem;
      font-weight: 300;
    }

    /* Divider */
    hr {
      border: none;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(124,58,237,0.4), transparent);
      margin: 1.8rem 0;
    }

    /* Bio */
    .bio {
      font-size: 0.95rem;
      line-height: 1.8;
      color: #94a3b8;
      margin-bottom: 2rem;
    }

    /* Skills */
    .skills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 2.5rem;
    }
    .skill {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      padding: 5px 14px;
      font-size: 0.8rem;
      color: #cbd5e1;
      letter-spacing: 0.02em;
      transition: border-color 0.2s, color 0.2s;
    }
    .skill:hover {
      border-color: rgba(124,58,237,0.5);
      color: #a78bfa;
    }

    /* Links */
    .links {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 22px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 500;
      text-decoration: none;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #5b21b6);
      color: #fff;
      box-shadow: 0 4px 20px rgba(124,58,237,0.4);
    }
    .btn-primary:hover { box-shadow: 0 8px 28px rgba(124,58,237,0.55); }
    .btn-ghost {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.12);
      color: var(--text);
    }
    .btn-ghost:hover { border-color: rgba(124,58,237,0.5); color: #a78bfa; }

    /* Footer */
    .footer {
      text-align: center;
      margin-top: 2rem;
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.06em;
    }
  </style>
</head>
<body>
  <div class="orb2"></div>

  <main>
    <div class="card">
      <div class="badge">Available for work</div>

      <div class="avatar">🤖</div>

      <h1>シミズツバサ</h1>
      <p class="role">AI Engineer</p>

      <p class="bio">
        AIの力で、未来のプロダクトをつくる。<br>
        機械学習モデルの設計から本番環境への展開まで、エンドツーエンドで担当。<br>
        シンプルで美しい技術を追求しています。
      </p>

      <div class="skills">
        <span class="skill">Python</span>
        <span class="skill">PyTorch</span>
        <span class="skill">LLM</span>
        <span class="skill">RAG</span>
        <span class="skill">MLOps</span>
        <span class="skill">Claude API</span>
        <span class="skill">FastAPI</span>
        <span class="skill">Docker</span>
      </div>

      <hr>

      <div class="links">
        <a class="btn btn-primary" href="mailto:hello@example.com">
          ✉ Contact
        </a>
        <a class="btn btn-ghost" href="https://github.com" target="_blank" rel="noopener">
          ⌥ GitHub
        </a>
        <a class="btn btn-ghost" href="https://twitter.com" target="_blank" rel="noopener">
          ✦ X / Twitter
        </a>
      </div>
    </div>

    <p class="footer">© 2026 Shimizu Tsubasa — Built with passion &amp; code</p>
  </main>
</body>
</html>
